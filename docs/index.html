<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUNESDAY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #0f0;
    font-family: 'Courier New', Courier, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
    gap: 1.5rem;
  }
  pre#header {
    font-size: clamp(4px, 0.9vw, 14px);
    line-height: 1.1;
    white-space: pre;
    color: #fff;
  }
  #quiz {
    max-width: 640px;
    width: 100%;
    border: 1px solid #0f0;
    padding: 1.5rem 1.25rem;
    font-size: clamp(11px, 1.8vw, 15px);
    line-height: 1.5;
  }
  #quiz pre, #quiz .mono { white-space: pre-wrap; word-break: break-word; }

  /* Menu */
  #quiz-menu { text-align: center; }
  #quiz-menu .title { font-size: 1.1em; margin-bottom: 0.75rem; margin-top: 0.75rem; display: block; }
  #quiz-menu .title:first-child { margin-top: 0; }
  #quiz-menu .menu-btn {
    display: block;
    width: 100%;
    background: #000;
    color: #0f0;
    border: 1px solid #0f0;
    padding: 0.6rem 1rem;
    margin: 0.4rem 0;
    font-family: inherit;
    font-size: 1em;
    cursor: pointer;
    text-align: center;
    letter-spacing: 1px;
  }
  #quiz-menu .menu-btn:hover { background: #0f0; color: #000; }
  #quiz-menu .menu-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* Game */
  #quiz-status { margin-bottom: 0.5rem; }
  #countdown-container { margin: 0.5rem 0; }
  #countdown-label { margin-right: 0.5rem; }
  #countdown-bar { color: #0f0; }
  #quiz-prompt { margin: 0.5rem 0; }

  .answer-btn {
    display: block;
    width: 100%;
    background: #000;
    color: #0f0;
    border: 1px solid #0f0;
    padding: 0.5rem 1rem;
    margin: 0.3rem 0;
    font-family: inherit;
    font-size: 1em;
    cursor: pointer;
    text-align: left;
  }
  .answer-btn:hover:not(:disabled) { background: #0f0; color: #000; }
  .answer-btn:disabled { cursor: not-allowed; }
  .answer-btn.correct-highlight { background: #0f0; color: #000; border-color: #0f0; }
  .answer-btn.wrong-highlight { background: #f00; color: #000; border-color: #f00; }

  #quiz-feedback { margin-top: 0.5rem; }
  #quiz-feedback.correct { color: #0f0; }
  #quiz-feedback.wrong { color: #f00; }

  /* End */
  #quiz-end { text-align: center; }
  #quiz-end pre { margin-bottom: 0.75rem; }
  #quiz-end .end-btn {
    display: inline-block;
    background: #000;
    color: #0f0;
    border: 1px solid #0f0;
    padding: 0.5rem 1.5rem;
    margin-top: 0.5rem;
    font-family: inherit;
    font-size: 1em;
    cursor: pointer;
  }
  #quiz-end .end-btn:hover { background: #0f0; color: #000; }

  /* Error */
  #quiz-error pre { margin-bottom: 0.5rem; }

  /* Loading */
  .loading { animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Playback */
  #playback-ui { text-align: center; }
  #playback-now-playing { margin-bottom: 0.25rem; }
  #playback-details { opacity: 0.7; margin-bottom: 0.5rem; }
  #playback-progress-container { margin-bottom: 0.5rem; }
  #playback-progress-bar { color: #0f0; }
  #playback-progress-time { margin-left: 0.4rem; }
  #playback-controls { display: flex; justify-content: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
  #playback-volume-controls { display: flex; justify-content: center; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
  #playback-vol-level { display: inline-block; min-width: 2.5em; text-align: center; }
  .control-btn {
    background: #000; color: #0f0; border: 1px solid #0f0;
    padding: 0.4rem 0.75rem; font-family: inherit; font-size: 1em;
    cursor: pointer; white-space: nowrap;
  }
  .control-btn:hover { background: #0f0; color: #000; }

  /* Player wrapper (CRT terminal aesthetic) */
  #player-wrapper {
    width: 100%;
    max-width: 640px;
    margin-top: 1rem;
    border: 2px solid #0f0;
    box-shadow: 0 0 12px rgba(0,255,0,0.12);
    background: #000;
  }
  #player-terminal-header {
    background: #0f0;
    color: #000;
    font-family: inherit;
    font-size: 0.75em;
    padding: 0.15rem 0.5rem;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #player-inner {
    position: relative;
    overflow: hidden;
    height: 250px;
  }
  #player-inner::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.4) 2px,
      rgba(0,0,0,0.4) 4px
    );
    pointer-events: none;
  }
  #player-inner iframe {
    position: absolute;
    top: -42px;
    left: 0;
    width: 100%;
    height: calc(100% + 42px);
  }
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<pre id="header"></pre>
<div id="quiz">
  <div id="quiz-loading" class="loading mono">Loading tunesday data...</div>
  <div id="quiz-menu" hidden></div>
  <div id="quiz-game" hidden>
    <pre id="quiz-status"></pre>
    <div id="countdown-container">
      <span id="countdown-label">[</span><span id="countdown-bar"></span><span>]</span>
    </div>
    <pre id="quiz-prompt">Who submitted this tune?</pre>
    <div id="quiz-answers"></div>
    <pre id="quiz-feedback" hidden></pre>
  </div>
  <div id="playback-ui" hidden>
    <pre id="playback-now-playing"></pre>
    <pre id="playback-details"></pre>
    <div id="playback-progress-container">
      <span id="playback-progress-label">[</span><span id="playback-progress-bar"></span><span>]</span>
      <span id="playback-progress-time"></span>
    </div>
    <div id="playback-controls">
      <button class="control-btn" onclick="window.playbackEngine.prev()">[ ◀◀ Prev ]</button>
      <button class="control-btn" id="playback-pause-btn" onclick="window.playbackEngine.togglePause()">[ ⏸ Pause ]</button>
      <button class="control-btn" onclick="window.playbackEngine.next()">[ ▶▶ Next ]</button>
      <button class="control-btn" onclick="window.playbackEngine.stop()">[ ■ Stop ]</button>
    </div>
    <div id="playback-volume-controls">
      <button class="control-btn" onclick="window.playbackEngine.volDown()">[ Vol - ]</button>
      <span id="playback-vol-level">100</span>
      <button class="control-btn" onclick="window.playbackEngine.volUp()">[ Vol + ]</button>
      <button class="control-btn" id="playback-mute-btn" onclick="window.playbackEngine.toggleMute()">[ Mute ]</button>
    </div>
  </div>
  <div id="quiz-end" hidden></div>
  <div id="quiz-error" hidden></div>
</div>
<div id="player-wrapper" hidden>
    <div id="player-terminal-header">tunesday.online</div>
    <div id="player-inner"><div id="player"></div></div>
</div>
<script>
(function() {
  var SNIPPET_DURATION = 10;
  var COUNTDOWN_STEPS = 20;
  var FEEDBACK_DELAY = 2000;
  var MIN_VIDEO_DURATION = 25;

  var params = new URLSearchParams(location.search);
  var dataPath = params.get('data') || 'tunesday.json';
  var forceMode = params.get('mode');

  /* ── DOM refs ── */
  var $ = function(id) { return document.getElementById(id); };
  var elHeader   = $('header');
  var elLoading  = $('quiz-loading');
  var elMenu     = $('quiz-menu');
  var elGame     = $('quiz-game');
  var elEnd      = $('quiz-end');
  var elError    = $('quiz-error');
  var elStatus   = $('quiz-status');
  var elCBar     = $('countdown-bar');
  var elCLabel   = $('countdown-label');
  var elAnswers  = $('quiz-answers');
  var elFeedback = $('quiz-feedback');
  var elPrompt   = $('quiz-prompt');
  var elPlayerW  = $('player-wrapper');
  var elPlaybackUi = $('playback-ui');
  var elPlaybackNowPlaying = $('playback-now-playing');
  var elPlaybackDetails = $('playback-details');
  var elPlaybackPauseBtn = $('playback-pause-btn');
  var elPlaybackMuteBtn = $('playback-mute-btn');
  var elPBVolLevel = $('playback-vol-level');
  var elPBProgressBar = $('playback-progress-bar');
  var elPBProgressTime = $('playback-progress-time');
  var elPBProgressLabel = $('playback-progress-label');

  /* ── ASCII header (keep existing logic) ── */
  var isTuesday = new Date().getDay() === 2 || location.search.includes('force');
  if (isTuesday) {
    elHeader.textContent =
'██████████████████████████████████████████████████████████████████████████\n' +
'█▌                                                                      ▐█\n' +
'█▌                                                                      ▐█\n' +
'█▌                                                                      ▐█\n' +
'█▌     ░▀█▀░▀█▀░▀░█▀▀░░░░░░░░░                                          ▐█\n' +
'█▌     ░░█░░░█░░░░▀▀█░░░░░░░░░                                          ▐█\n' +
'█▌     ░▀▀▀░░▀░░░░▀▀▀░▀░░▀░░▀░                                          ▐█\n' +
'█▌     ░█░█░█▀█░█▀█░█▀█░█░█░░░▀█▀░█░█░█▀█░█▀▀░█▀▀░█▀▄░█▀█░█░█░░░█░█     ▐█\n' +
'█▌     ░█▀█░█▀█░█▀▀░█▀▀░░█░░░░░█░░█░█░█░█░█▀▀░▀▀█░█░█░█▀█░░█░░░░▀░▀     ▐█\n' +
'█▌     ░▀░▀░▀░▀░▀░░░▀░░░░▀░░░░░▀░░▀▀▀░▀░▀░▀▀▀░▀▀▀░▀▀░░▀░▀░░▀░░░░▀░▀     ▐█\n' +
'█▌                                                                      ▐█\n' +
'█▌                                                                      ▐█\n' +
'█▌                                                                      ▐█\n' +
'██████████████████████████████████████████████████████████████████████████\n';
  } else {
    elHeader.textContent =
'████████████████████████████████████████████████████████████████████████████████████████\n' +
'█▌                                                                                    ▐█\n' +
'█▌                                                                                    ▐█\n' +
'█▌                                                                                    ▐█\n' +
'█▌     ░█░█░░░▀█▀░▀█▀░▀░█▀▀░░░█▀█░█▀█░▀█▀░░░▀█▀░█░█░█▀█░█▀▀░█▀▀░█▀▄░█▀█░█░█░░░█░█     ▐█\n' +
'█▌     ░▀░▀░░░░█░░░█░░░░▀▀█░░░█░█░█░█░░█░░░░░█░░█░█░█░█░█▀▀░▀▀█░█░█░█▀█░░█░░░░▀░▀     ▐█\n' +
'█▌     ░▀░▀░░░▀▀▀░░▀░░░░▀▀▀░░░▀░▀░▀▀▀░░▀░░░░░▀░░▀▀▀░▀░▀░▀▀▀░▀▀▀░▀▀░░▀░▀░░▀░░░░▀░▀     ▐█\n' +
'█▌                                                                                    ▐█\n' +
'█▌                                                                                    ▐█\n' +
'█▌                                                                                    ▐█\n' +
'████████████████████████████████████████████████████████████████████████████████████████\n';
  }

  /* ── YouTube player ── */
  var ytPlayer = null;
  var onVideoReady = null;
  var onLoadError = null;
  var loadTimeout = null;
  var roundTimedOut = false;
  var playbackEngine = null;

  function setupPlayer(cb) {
    ytPlayer = new YT.Player('player', {
      height: '200',
      width: '300',
      playerVars: { autoplay: 1, controls: 0, enablejsapi: 1, modestbranding: 1, rel: 0 },
      events: {
        onReady: function() {
          cb();
        },
        onStateChange: function(ev) {
          if (ev.data === YT.PlayerState.PLAYING) {
            if (playbackEngine && playbackEngine.active) {
              playbackEngine.paused = false;
              elPlaybackPauseBtn.textContent = '[ \u23F8 Pause ]';
            }
            if (onVideoReady) {
              onVideoReady();
              onVideoReady = null;
            }
          }
          if (ev.data === YT.PlayerState.ENDED) {
            if (playbackEngine && playbackEngine.active) {
              playbackEngine.next();
            } else {
              ytPlayer.stopVideo();
            }
          }
        },
        onError: function(ev) {
          console.warn('YT error on video:', ev);
          if (playbackEngine && playbackEngine.active) {
            if (loadTimeout) { clearTimeout(loadTimeout); loadTimeout = null; }
            onVideoReady = null;
            onLoadError = null;
            playbackEngine.next();
            return;
          }
          if (onLoadError) {
            var cb = onLoadError;
            onLoadError = null;
            onVideoReady = null;
            if (loadTimeout) { clearTimeout(loadTimeout); loadTimeout = null; }
            cb(new Error('Video unavailable'));
          }
        }
      }
    });
  }

  function loadVideo(videoId, cb, playFull) {
    var settled = false;
    onLoadError = cb;

    loadTimeout = setTimeout(function() {
      if (!settled && onLoadError) {
        onVideoReady = null;
        onLoadError = null;
        loadTimeout = null;
        cb(new Error('Video load timed out'));
      }
    }, 15000);

    onVideoReady = function() {
      if (settled) return;
      settled = true;
      if (loadTimeout) { clearTimeout(loadTimeout); loadTimeout = null; }
      onVideoReady = null;
      onLoadError = null;
      if (!playFull) {
        var dur = ytPlayer.getDuration();
        if (dur < MIN_VIDEO_DURATION) {
          ytPlayer.stopVideo();
          cb(new Error('Video too short'));
          return;
        }
        var start = Math.floor(dur * (0.10 + Math.random() * 0.70));
        ytPlayer.seekTo(start);
      }
      cb();
    };

    ytPlayer.loadVideoById(videoId);
  }

  function pauseVideo() {
    if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
      ytPlayer.pauseVideo();
    }
  }

  /* ── QuizEngine ── */
  function QuizEngine(allTunes, allProviders) {
    this.allTunes = allTunes;
    this.allProviders = allProviders;
    this.queue = [];
    this.round = 0;
    this.total = 0;
    this.score = 0;
    this.currentTune = null;
    this.countdownTimer = null;
    this.feedbackTimer = null;
    this.guessed = false;
  }

  QuizEngine.prototype.shuffle = function(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  };

  QuizEngine.prototype.pickWrongProviders = function(correct, count) {
    var others = this.allProviders.filter(function(p) { return p !== correct; });
    others = this.shuffle(others);
    var picked = [correct];
    var needed = count - 1;
    for (var i = 0; i < others.length && picked.length < count; i++) {
      if (others[i] !== correct) picked.push(others[i]);
    }
    return this.shuffle(picked);
  };

  QuizEngine.prototype.renderCountdown = function(remaining) {
    var full = COUNTDOWN_STEPS;
    var filled = Math.max(0, Math.round(remaining / SNIPPET_DURATION * full));
    var bar = '';
    for (var i = 0; i < full; i++) {
      bar += i < filled ? '\u2588' : '\u2591';
    }
    elCBar.textContent = bar + ' ' + remaining + 's';
  };

  QuizEngine.prototype.clearTimers = function() {
    if (this.countdownTimer) { clearInterval(this.countdownTimer); this.countdownTimer = null; }
    if (this.feedbackTimer) { clearTimeout(this.feedbackTimer); this.feedbackTimer = null; }
  };

  QuizEngine.prototype.startGame = function(mode) {
    var self = this;
    var available = this.allTunes.filter(function(t) { return t.id && t.id.length >= 10 && t.provider; });
    if (available.length === 0) {
      showError('No tunes with valid YouTube IDs found.');
      return;
    }

    var count = mode === 0 ? available.length : Math.min(mode, available.length);
    if (count < 1) {
      showError('Not enough tunes to play this mode.');
      return;
    }
    if (this.allProviders.length < 2) {
      showError('Need at least 2 different providers to play.\nOnly found: ' + this.allProviders.join(', '));
      return;
    }

    var shuffled = self.shuffle(available);
    self.queue = shuffled.slice(0, count);
    self.round = 0;
    self.total = count;
    self.score = 0;

    showGame();
    self.nextRound();
  };

  QuizEngine.prototype.nextRound = function() {
    var self = this;
    self.clearTimers();

    if (self.round >= self.total) {
      self.endGame();
      return;
    }

    self.guessed = false;
    roundTimedOut = false;
    self.currentTune = self.queue[self.round];
    self.round++;

    self.renderCountdown(SNIPPET_DURATION);
    elStatus.textContent = 'Round ' + self.round + '/' + self.total + '  \u2502  Score: ' + self.score;
    elAnswers.innerHTML = '';
    elFeedback.hidden = true;
    elPrompt.hidden = true;

    elCLabel.textContent = 'Loading... [';

    loadVideo(self.currentTune.id, function(err) {
      if (err) {
        console.warn('Skipping tune (error):', self.currentTune.name, err.message);
        self.nextRound();
        return;
      }

      elCLabel.textContent = '[';
      elPrompt.hidden = false;
      self.renderChoices();
      self.startCountdown();
    });
  };

  QuizEngine.prototype.renderChoices = function() {
    var self = this;
    var options = self.pickWrongProviders(self.currentTune.provider, Math.min(4, self.allProviders.length));
    elAnswers.innerHTML = '';

    options.forEach(function(provider, idx) {
      var btn = document.createElement('button');
      var num = idx + 1;
      btn.className = 'answer-btn';
      btn.textContent = '[' + num + '] ' + provider;
      btn.addEventListener('click', function() { self.handleGuess(provider); });
      btn.dataset.num = num;
      elAnswers.appendChild(btn);
    });
  };

  QuizEngine.prototype.startCountdown = function() {
    var self = this;
    var start = Date.now();
    var end = start + SNIPPET_DURATION * 1000;

    self.countdownTimer = setInterval(function() {
      var remaining = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      self.renderCountdown(remaining);

      if (Date.now() >= end) {
        clearInterval(self.countdownTimer);
        self.countdownTimer = null;
        if (!self.guessed) {
          roundTimedOut = true;
          pauseVideo();
          self.showFeedback(false);
        }
      }
    }, 100);
  };

  QuizEngine.prototype.handleGuess = function(provider) {
    var self = this;
    if (self.guessed) return;
    self.guessed = true;
    self.clearTimers();
    pauseVideo();

    var correct = self.currentTune.provider;
    self.showFeedback(provider === correct, provider, correct);
  };

  QuizEngine.prototype.showFeedback = function(isCorrect, guessed, correct) {
    var self = this;
    var provider = correct || self.currentTune.provider;
    var tuneName = self.currentTune.name || 'Unknown track';
    var link = self.currentTune.link || '';

    if (isCorrect) {
      self.score++;
      elFeedback.className = 'correct';
      elFeedback.innerHTML = '\u2714 Correct! ' + provider + ' submitted "' + tuneName + '"';
    } else if (roundTimedOut) {
      elFeedback.className = 'wrong';
      elFeedback.innerHTML = '\u23F1 Time\'s up! ' + provider + ' submitted "' + tuneName + '"';
    } else {
      elFeedback.className = 'wrong';
      elFeedback.innerHTML = '\u2718 Wrong! ' + provider + ' submitted "' + tuneName + '"';
    }
    elFeedback.hidden = false;

    elStatus.textContent = 'Round ' + self.round + '/' + self.total + '  \u2502  Score: ' + self.score;

    var btns = elAnswers.querySelectorAll('.answer-btn');
    btns.forEach(function(btn) {
      btn.disabled = true;
      if (btn.textContent.indexOf(correct || provider) !== -1) {
        btn.classList.add('correct-highlight');
      }
      if (guessed && btn.textContent.indexOf(guessed) !== -1 && guessed !== (correct || provider)) {
        btn.classList.add('wrong-highlight');
      }
    });

    self.feedbackTimer = setTimeout(function() {
      self.nextRound();
    }, FEEDBACK_DELAY);
  };

  QuizEngine.prototype.endGame = function() {
    var self = this;
    showEl(elEnd);
    hideEl(elGame);
    hideEl(elPlayerW);
    pauseVideo();

    var pct = self.total > 0 ? Math.round(self.score / self.total * 100) : 0;
    var barFull = COUNTDOWN_STEPS;
    var barFilled = Math.round(pct / 100 * barFull);
    var bar = '';
    for (var i = 0; i < barFull; i++) {
      bar += i < barFilled ? '\u2588' : '\u2591';
    }

    var msg;
    if (pct === 100) msg = 'Perfect! You know your team inside out.';
    else if (pct >= 80) msg = 'Great ear for your team!';
    else if (pct >= 50) msg = 'Not bad! Keep listening.';
    else msg = 'Time to attend more tunesday sessions...';

    elEnd.innerHTML =
      '<pre>GAME OVER</pre>' +
      '<pre>' + self.score + ' / ' + self.total + ' correct</pre>' +
      '<pre>' + bar + ' ' + pct + '%</pre>' +
      '<pre>' + msg + '</pre>' +
      '<button class="end-btn" onclick="engine.reset()">[ Play Again ]</button>';
  };

  QuizEngine.prototype.reset = function() {
    this.clearTimers();
    pauseVideo();
    this.queue = [];
    this.round = 0;
    this.total = 0;
    this.score = 0;
    showMenu();
  };

  /* ── PlaybackEngine ── */
  function PlaybackEngine(tunes) {
    this.tunes = tunes;
    this.queue = [];
    this.index = 0;
    this.active = false;
    this.paused = false;
    this.progressTimer = null;
    this.volume = 100;
    this.muted = false;
  }

  PlaybackEngine.prototype.shuffleArr = function(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  };

  PlaybackEngine.prototype.formatTime = function(sec) {
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  PlaybackEngine.prototype.renderProgress = function() {
    if (!this.active || !ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
    var dur = ytPlayer.getDuration();
    var cur = ytPlayer.getCurrentTime();
    if (!dur || dur <= 0) {
      elPBProgressBar.textContent = '';
      elPBProgressTime.textContent = '';
      return;
    }
    var steps = 20;
    var pct = Math.max(0, Math.min(1, cur / dur));
    var filled = Math.round(pct * steps);
    var bar = '';
    for (var i = 0; i < steps; i++) bar += i < filled ? '\u2588' : '\u2591';
    elPBProgressBar.textContent = bar;
    elPBProgressTime.textContent = ' ' + this.formatTime(cur) + ' / ' + this.formatTime(dur);
  };

  PlaybackEngine.prototype.startProgressTimer = function() {
    var self = this;
    if (this.progressTimer) clearInterval(this.progressTimer);
    this.progressTimer = setInterval(function() { self.renderProgress(); }, 500);
  };

  PlaybackEngine.prototype.stopProgressTimer = function() {
    if (this.progressTimer) { clearInterval(this.progressTimer); this.progressTimer = null; }
  };

  PlaybackEngine.prototype.updateVolumeDisplay = function() {
    elPBVolLevel.textContent = this.muted ? 'MUTED' : String(this.volume);
    elPlaybackMuteBtn.textContent = this.muted ? '[ Unmute ]' : '[ Mute ]';
  };

  PlaybackEngine.prototype.start = function(doShuffle) {
    this.queue = doShuffle ? this.shuffleArr(this.tunes.slice()) : this.tunes.slice();
    this.index = 0;
    this.active = true;
    this.paused = false;
    if (ytPlayer && typeof ytPlayer.setVolume === 'function') {
      ytPlayer.setVolume(this.volume);
      if (this.muted) ytPlayer.mute(); else ytPlayer.unMute();
    }
    this.updateVolumeDisplay();
    hideEl(elMenu); hideEl(elGame); hideEl(elEnd); hideEl(elError); hideEl(elLoading);
    showEl(elPlaybackUi);
    showEl(elPlayerW);
    elPBProgressBar.textContent = '';
    elPBProgressTime.textContent = '';
    elPBProgressLabel.textContent = 'Loading... [';
    this.playCurrent();
  };

  PlaybackEngine.prototype.playCurrent = function() {
    var self = this;
    var tune = this.queue[this.index];
    this.renderNowPlaying(tune);
    this.stopProgressTimer();
    elPBProgressBar.textContent = '';
    elPBProgressTime.textContent = '';
    elPBProgressLabel.textContent = 'Loading... [';
    loadVideo(tune.id, function(err) {
      if (err) {
        console.warn('Playback skip:', err.message);
        self.next();
      } else {
        elPBProgressLabel.textContent = '[';
        self.startProgressTimer();
      }
    }, true);
  };

  PlaybackEngine.prototype.renderNowPlaying = function(tune) {
    var name = tune.name || 'Unknown track';
    var provider = tune.provider || 'unknown';
    var date = '';
    if (tune.added_at) {
      try { date = new Date(tune.added_at).toISOString().split('T')[0]; } catch(e) {}
    }
    elPlaybackNowPlaying.textContent = '\u25B6 ' + name;
    elPlaybackDetails.textContent = 'submitted by ' + provider + (date ? ' \u00B7 ' + date : '');
  };

  PlaybackEngine.prototype.prev = function() {
    if (this.queue.length === 0) return;
    this.index = this.index > 0 ? this.index - 1 : this.queue.length - 1;
    this.playCurrent();
  };

  PlaybackEngine.prototype.next = function() {
    if (this.queue.length === 0) return;
    this.index = this.index < this.queue.length - 1 ? this.index + 1 : 0;
    this.playCurrent();
  };

  PlaybackEngine.prototype.togglePause = function() {
    if (!this.active) return;
    if (this.paused) {
      ytPlayer.playVideo();
      this.paused = false;
      elPlaybackPauseBtn.textContent = '[ \u23F8 Pause ]';
      this.startProgressTimer();
    } else {
      ytPlayer.pauseVideo();
      this.paused = true;
      elPlaybackPauseBtn.textContent = '[ \u25B6 Play  ]';
      this.stopProgressTimer();
    }
  };

  PlaybackEngine.prototype.volUp = function() {
    if (!this.active) return;
    this.volume = Math.min(100, this.volume + 10);
    if (this.muted) { this.muted = false; if (ytPlayer) ytPlayer.unMute(); }
    if (ytPlayer) ytPlayer.setVolume(this.volume);
    this.updateVolumeDisplay();
  };

  PlaybackEngine.prototype.volDown = function() {
    if (!this.active) return;
    this.volume = Math.max(0, this.volume - 10);
    if (this.muted) { this.muted = false; if (ytPlayer) ytPlayer.unMute(); }
    if (ytPlayer) ytPlayer.setVolume(this.volume);
    this.updateVolumeDisplay();
  };

  PlaybackEngine.prototype.toggleMute = function() {
    if (!this.active) return;
    this.muted = !this.muted;
    if (ytPlayer) {
      if (this.muted) ytPlayer.mute(); else ytPlayer.unMute();
    }
    this.updateVolumeDisplay();
  };

  PlaybackEngine.prototype.stop = function() {
    this.active = false;
    this.paused = false;
    this.stopProgressTimer();
    ytPlayer.stopVideo();
    hideEl(elPlaybackUi);
    hideEl(elPlayerW);
    showMenu();
  };

  /* ── UI helpers ── */
  function hideEl(el) { el.hidden = true; }
  function showEl(el) { el.hidden = false; }

  function showMenu() {
    hideEl(elLoading); hideEl(elGame); hideEl(elEnd); hideEl(elError); hideEl(elPlayerW); hideEl(elPlaybackUi);
    showEl(elMenu);
  }

  function showGame() {
    hideEl(elLoading); hideEl(elMenu); hideEl(elEnd); hideEl(elError); hideEl(elPlaybackUi);
    showEl(elGame);
    showEl(elPlayerW);
  }

  function showError(msg) {
    hideEl(elLoading); hideEl(elMenu); hideEl(elGame); hideEl(elEnd); hideEl(elPlayerW); hideEl(elPlaybackUi);
    showEl(elError);
    elError.innerHTML = '<pre>' + msg + '</pre>';
    var retry = document.createElement('button');
    retry.className = 'menu-btn';
    retry.textContent = '[ Retry ]';
    retry.addEventListener('click', function() { initQuiz(); });
    elError.appendChild(retry);
  }

  /* ── Keyboard shortcuts ── */
  document.addEventListener('keydown', function(e) {
    if (!engine || !engine.currentTune || engine.guessed) return;
    var num = parseInt(e.key, 10);
    if (num >= 1 && num <= 4) {
      var btns = elAnswers.querySelectorAll('.answer-btn');
      var target = null;
      btns.forEach(function(b) { if (parseInt(b.dataset.num, 10) === num) target = b; });
      if (target && !target.disabled) target.click();
    }
  });

  /* ── Init ── */
  window.engine = null;

  function initQuiz() {
    elLoading.textContent = 'Loading tunesday data...';
    showEl(elLoading); hideEl(elMenu); hideEl(elGame); hideEl(elEnd); hideEl(elError); hideEl(elPlayerW); hideEl(elPlaybackUi);

    fetch(dataPath + (dataPath.indexOf('?') === -1 ? '?_=' + Date.now() : '&_=' + Date.now()))
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        var tunes = data.tunes || [];
        if (tunes.length === 0) {
          showError('No tunes in ' + dataPath);
          return;
        }

        var providerSet = {};
        tunes.forEach(function(t) {
          if (t.provider) providerSet[t.provider] = true;
        });
        var providers = Object.keys(providerSet);

        if (providers.length < 2) {
          showError('Need at least 2 different providers.\nFound: ' + (providers.join(', ') || 'none'));
          return;
        }

        engine = new QuizEngine(tunes, providers);
        buildMenu(providers, tunes);

        if (forceMode) {
          var modeMap = { '5': 5, '42': 42, 'all': 0 };
          var mode = modeMap[forceMode];
          if (mode !== undefined) {
            engine.startGame(mode);
            return;
          }
        }

        showMenu();
      })
      .catch(function(err) {
        var detail = err.message || String(err);
        var isFileBlock = /NetworkError|Failed to fetch/.test(detail) && location.protocol === 'file:';
        if (isFileBlock) {
          var serveDir = dataPath.includes('/') ? dataPath.replace(/\/[^\/]*$/, '') : '.';
          detail += '\n\nBrowsers block fetch() from file:// URLs.\nServe via HTTP:\n  python3 -m http.server 8080 -d ' + serveDir + '\n  then open http://localhost:8080/';
        } else {
          detail += '\n\nCheck that ' + dataPath + ' exists and is readable.\n' +
            'Current URL: ' + location.href + '\n' +
            'Protocol: ' + location.protocol;
        }
        showError('Failed to load ' + dataPath + '\n' + detail);
      });
  }

  function buildMenu(providers, tunes) {
    var available = tunes.filter(function(t) { return t.id && t.id.length >= 10 && t.provider; });
    var total = available.length;

    playbackEngine = window.playbackEngine = new PlaybackEngine(available);

    elMenu.innerHTML =
      '<span class="title mono">GUESS THE PROVIDER</span>' +
      '<span class="mono">' + tunes.length + ' tunes from ' + providers.length + ' provider' + (providers.length !== 1 ? 's' : '') + '</span>' +
      '<button class="menu-btn" onclick="engine.startGame(5)">[ Quick Game (5) ]</button>' +
      '<button class="menu-btn" onclick="engine.startGame(42)"' + (total < 42 ? ' title="Only ' + total + ' tunes available"' : '') + '>[ Life, Universe &amp; Everything (42) ]</button>' +
      '<button class="menu-btn" onclick="engine.startGame(0)">[ All (' + total + ' tunes)  ]</button>' +
      '<span class="title mono">PLAYBACK</span>' +
      '<button class="menu-btn" onclick="window.playbackEngine.start(true)">[ Shuffle All              ]</button>' +
      '<button class="menu-btn" onclick="window.playbackEngine.start(false)">[ Play In Order            ]</button>';
  }

  /* ── Bootstrap ── */
  if (!isTuesday) {
    elLoading.textContent = '';
    elLoading.classList.remove('loading');
    elLoading.innerHTML = '<pre>Come back on a Tunesday.\n\nOr pass ?force to override.</pre>';
  } else if (typeof YT !== 'undefined' && YT.Player) {
    setupPlayer(function() { initQuiz(); });
  } else {
    window.onYouTubeIframeAPIReady = function() {
      setupPlayer(function() { initQuiz(); });
    };
  }
})();
</script>
</body>
</html>
