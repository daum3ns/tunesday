name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Run tests
        run: make test

  build-binary:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build server binary
        run: make build-server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tunesday-binary
          path: build/tunesday.online

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tunesday.online/Dockerfile
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/tunesday:${{ github.ref_name }}

  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog section for tag
        id: extract
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; print; next }
            found && $0 ~ "^## \\[" { exit }
            found { print }
          ' CHANGELOG.md \
            | sed '/^\[[^]]*\]: /d' \
            > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No changelog entry found for version $VERSION. Move the Unreleased section to ## [ $VERSION ] before tagging."
            exit 1
          fi

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  release:
    needs:
      - build-binary
      - release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tunesday-binary
          path: build

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/tunesday.online
          body_path: release-notes.md
